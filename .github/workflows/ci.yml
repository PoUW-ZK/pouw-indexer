name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    # A real Postgres for the tests that touch the database.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pouw
          POSTGRES_PASSWORD: pouw
          POSTGRES_DB: pouw_indexer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pouw"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://pouw:pouw@localhost:5432/pouw_indexer

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Reuses compiled dependencies between runs, so CI is not slow every time.
      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --check

      - name: Lints (warnings are errors)
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test