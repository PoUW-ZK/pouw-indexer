[package]
name = "pouw-indexer"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
borsh = { version = "1.8.1", features = ["derive"] }
dotenv = "0.15.0"
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio", "migrate"] }
tokio = { version = "1.54.1", features = ["full"] }
