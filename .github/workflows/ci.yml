name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-ok:
    name: ci-ok
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pouw
          POSTGRES_PASSWORD: pouw
          POSTGRES_DB: pouw_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pouw"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://pouw:pouw@localhost:5432/pouw_test
    steps:
      - uses: actions/checkout@v7

      - name: Detect project
        id: detect
        run: |
          if [ -f pyproject.toml ]; then echo "python=true" >> "$GITHUB_OUTPUT"; fi
          if find . -name '*.csproj' -not -path './.git/*' | grep -q .; then echo "dotnet=true" >> "$GITHUB_OUTPUT"; fi
          if [ ! -f pyproject.toml ] && ! find . -name '*.csproj' -not -path './.git/*' | grep -q .; then
            echo "::notice::Projekt zatiaľ neexistuje, kontroly sa preskočia."
          fi

      - uses: actions/setup-python@v5
        if: steps.detect.outputs.python == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        if: steps.detect.outputs.python == 'true'
        run: pip install -e ".[dev]"

      - name: Lint
        if: steps.detect.outputs.python == 'true'
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        if: steps.detect.outputs.python == 'true'
        # exit code 5 = tests in plans, so disable for now
        run: pytest || [ $? -eq 5 ]

      - name: Vulnerable dependencies (pip-audit)
        if: steps.detect.outputs.python == 'true'
        run: |
          pip install pip-audit
          pip-audit --skip-editable

      - uses: actions/setup-dotnet@v4
        if: steps.detect.outputs.dotnet == 'true'
        with:
          dotnet-version: 8.0.x

      - name: Build and test (.NET)
        if: steps.detect.outputs.dotnet == 'true'
        run: |
          dotnet restore
          dotnet build --no-restore -warnaserror
          dotnet test --no-build

      - name: Vulnerable dependencies (.NET)
        if: steps.detect.outputs.dotnet == 'true'
        run: |
          dotnet list package --vulnerable --include-transitive | tee vuln.txt
          if grep -q "has the following vulnerable packages" vuln.txt; then exit 1; fi

      - name: Dockerfile lint (hadolint)
        if: hashFiles('Dockerfile') != ''
        run: docker run --rm -i hadolint/hadolint < Dockerfile
